; ===== Транк Zadarma (регистрация по логину SIP) =====
; ZADARMA_LOGIN / ZADARMA_PASSWORD подставляет setup_vps.sh из .env
; ZADARMA_SERVER: sipal1.zadarma.com (Алматы) или sip.zadarma.com; ZADARMA_PROTO: tcp или udp
; Логин и пароль: личный кабинет Zadarma -> Настройки -> SIP-подключение (или АТС -> внутренний номер)

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; TCP: домашние роутеры (SIP ALG) и провайдеры часто режут SIP по UDP
[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

[zadarma]
type=registration
transport={{ZADARMA_TRANSPORT}}
outbound_auth=zadarma
server_uri=sip:{{ZADARMA_SERVER}};transport={{ZADARMA_PROTO}}
client_uri=sip:{{ZADARMA_LOGIN}}@sip.zadarma.com
contact_user={{ZADARMA_LOGIN}}
retry_interval=60
forbidden_retry_interval=600
expiration=120
line=yes
endpoint=zadarma

[zadarma]
type=auth
auth_type=userpass
username={{ZADARMA_LOGIN}}
password={{ZADARMA_PASSWORD}}

[zadarma]
type=aor
contact=sip:{{ZADARMA_SERVER}};transport={{ZADARMA_PROTO}}
qualify_frequency=0   ; не блокировать звонки, если OPTIONS не проходят

[zadarma]
type=endpoint
transport={{ZADARMA_TRANSPORT}}
context=zadarma-in
disallow=all
allow=alaw,ulaw
outbound_auth=zadarma
aors=zadarma
from_user={{ZADARMA_LOGIN}}
from_domain=sip.zadarma.com
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
rtp_timeout=20
rtp_timeout_hold=60

[zadarma]
type=identify
endpoint=zadarma
match={{ZADARMA_SERVER}}
