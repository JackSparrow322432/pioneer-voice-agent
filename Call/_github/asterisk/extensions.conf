; ===== Голосовой ИИ-агент =====

[general]
static=yes
writeprotect=yes

; Исходящий: AMI Originate звонит клиенту через транк, после ответа попадаем сюда
[ai-outbound]
exten => s,1,NoOp(AI outbound ${AI_UUID})
 same => n,Answer()
 same => n,AudioSocket(${AI_UUID},127.0.0.1:9092)
 same => n,Hangup()

; Входящие с Zadarma (любой набранный номер)
[zadarma-in]
exten => _X.,1,Goto(ai-inbound,s,1)
exten => _+X.,1,Goto(ai-inbound,s,1)
exten => s,1,Goto(ai-inbound,s,1)

[ai-inbound]
exten => s,1,NoOp(AI inbound from ${CALLERID(num)})
 same => n,Answer()
 same => n,Set(AI_UUID=${SHELL(cat /proc/sys/kernel/random/uuid | tr -d '\n')})
 same => n,Set(REG=${CURL(http://127.0.0.1:5050/asterisk/inbound?uuid=${AI_UUID}&phone=${URIENCODE(${CALLERID(num)})})})
 same => n,AudioSocket(${AI_UUID},127.0.0.1:9092)
 same => n,Hangup()
